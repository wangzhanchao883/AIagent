# 健康数据管家 —— 个人配置
#
# 由 bootstrap.py 生成。所有脚本都从这里读参数，不硬编码任何个人数据。
#
# ⚠️ 隐私提醒：这份文件里是**你的真实身体数据**（身高、年龄、目标体重）。
#   · 不要分享给别人，不要提交到公开仓库
#   · 备份时注意别传到云盘

profile:
  name: "你的名字"           # 显示在报告署名处
  sex: male                 # male / female
  birth_year: 1985          # 出生年份，用于 Mifflin-St Jeor 公式算基础代谢
  height_cm: 172            # 身高 cm，用于算 BMR 与体脂秤换算
  # 体重输入单位：kg / jin（1 斤 = 0.5 kg）。
  # 内部一律以 kg 存储，此处只决定「你报的数怎么解释」和「报告怎么显示」。
  # 默认 kg —— 换成 jin 之前想清楚：后期改单位，历史读数不会自动换算。
  weight_unit: kg
  # 拳宽：量拳头最宽处（cm）。用于食物照片的份量参照，报一次即可。
  # 9.0 只是示例值，按自己实测改。
  fist_width_cm: 9.0

# 目标（用于日报的「是否偏离目标」判断）
goals:
  weight_kg: 70.0           # 目标体重，按你自己的标准体重设
  waist_cm: 85.0            # 目标腰围（男 <90 为不腹型肥胖）
  calorie_target_kcal: 2000 # 每日摄入参考线（报告热量区间条上的那条虚线）
  # 以下四项供「近 14 天趋势图」的绿色达标带使用，不影响任何历史数据
  # 出处：中国居民膳食指南 / 成人肥胖食养指南（A 级）
  calcium_mg: 800             # 钙：成人 18–49 岁 800 mg/天，50 岁以上 1000 mg/天
  protein_g_per_kg: [1.2, 1.6] # 减重期保肌口径，按当日体重换算成 g
  veg_servings: 4             # 蔬菜每日拳数（一拳 = 熟重 100–130 g）
  sodium_mg: 2000             # 钠上限（≈ 盐 5 g/天）
  ferment_servings_target: 2  # 发酵食物达标线（份/天，口径见下方 fermented 块）
  sleep_target_min: 450     # 目标睡眠时长 7.5 小时
  steps_target: 8000        # 每日步数目标
  active_minutes_target: 30 # 每日中高强度活动分钟数

# 减重目标与安全边界
# 用途：报告里核算「热量缺口是否达标 / 是否过大影响健康」。
weight_loss:
  goal_kg: 70.0                     # 目标体重
  start_kg:                            # 起点体重（开始减重那天晨起空腹称的）
                                       # 留空 = 用体重库里最早一条记录，不编造起点
  start_date: ""                       # 开始减重的日期，格式 "2026-01-15"
                                       # 留空 = 用体重库里最早一条记录的日期（推荐）
                                       # ⚠️ 填早于第一条记录的日期会让趋势图左侧空一大段
  target_window_months: [6, 9]      # 期望 6 个月左右达成，最迟 9 个月
  rate_safe_kg_week: [0.4, 0.8]     # 安全速率（约 0.5–1% 体重/周）
  deficit_safe_kcal_day: [300, 750] # 日均热量缺口安全区间
  intake_floor_kcal: 1500           # 摄入下限（长期低于此值 = 缺口过大信号）
  # 消耗估算参数：Mifflin-St Jeor BMR × 活动系数
  #   BMR = 10×体重kg + 6.25×身高cm − 5×年龄 + 5
  #   活动系数：久坐为主 + 规律运动 → 1.4–1.55
  bmr_formula: "mifflin_st_jeor"
  activity_factor: [1.4, 1.55]
  red_flags:                        # 命中即降速，并在报告里如实指出
    - "周减重 >1.0 kg 连续 2 周"
    - "日均摄入长期 <1500 kcal"
    - "力量训练表现明显下滑 / 持续疲劳 / 静息心率持续升高"

# 体重测量条件
# 用途：录入体重的先验——**每天早上第一条体重记录 = 上述固定条件**，不再追问。
weight_measurement:
  daily_first: "晨起 · 上完厕所（排尿后）· 空腹 · 同一台秤 · 同一时间"
  ask_condition: false            # 每日首条不再追问测量条件，直接记
  non_first_policy: "需显式说明；默认不入主表"
  note_when_off_condition: true

# 腰围口径
waist_measurement:
  # 换尺 = 重新立基线：任何两次读数只要测量工具不同就不能相减
  rebaseline_on_tool_change: true
  preferred_tool: "软皮尺"        # 推荐软尺；钢卷尺绕不贴身，读数偏小
  baseline_cm: null              # 第一次认真测量后填（晨起空腹、脐水平、呼气末）
  baseline_date: null
  measure_frequency: "weekly"    # 周频足够，不必天天量

# 家庭餐默认口径
# ⚠️ 仅作「声明与自查」用：脚本不读取本节。
#    它是 AI 估算时的先验，不是库里的字段。**当场口述永远优先于本表**。
meal_defaults:
  home:
    # 家做油量取宽口径 10–20 g（全餐合计）。宁宽勿窄——油量是估算误差最大的一块。
    oil_total_g: [10, 20]
    staple: "米饭"                # 若照片明显是别的，按实际记
    chicken: "去皮"
    # 酸奶默认按无糖脱脂记（普通酸奶约 60–70 kcal / 100g）
    yogurt: "无糖"
  outside:
    oil: "high"                  # 外食/外卖一律按正常外卖油量（高油）算
    confidence_ceiling: "low"    # 外食置信度上限：低

# 发酵食物跟踪（可选维度，默认开启）
# 目的：肠道菌群支持。它与「六类营养素」不重叠，单列一项，不进热量 / 蛋白核算。
#
# ── 为什么定 2 份/天，而不是更多 ──────────────────────────────
# 目前唯一的人体 RCT：Wastyk et al., Cell 2021（n=36，10 周干预）。
#   高发酵组约 6 份/天 → 菌群 α 多样性上升、91 种炎症蛋白中 19 种下降；
#   效应剂量依赖，且高纤维组未出现同等改善。
#   ⚠️ 局限：样本小、周期短、终点是替代指标（菌群 / 炎症蛋白），不是硬结局。
# ⇒ 证据等级 B+（RCT，但小样本 / 替代终点）。
# 6 份/天 ≈ 酸奶 600 g（约 400 kcal），在减重热量预算里不可行；原文也明确
# **未确立最小有效剂量**。所以默认取 2 份为达标线、3 份为良好：可持续、热量可控。
#
# ── 什么算「1 份」─────────────────────────────────────────────
# 只计**含活菌、吃之前没有再加热**的发酵食品（加热即灭活）。
fermented:
  target_servings: 2          # 达标线（份/天）
  good_servings: 3            # 良好线（份/天）
  serving_definition:         # 1 份 = 下列任一
    发酵乳: "100 g（无糖酸奶 / 开菲尔 / 发酵乳）"
    发酵豆制品: "30 g（纳豆 / 豆豉；腐乳因钠极高单独看待）"
    发酵蔬菜: "50 g（泡菜 / 酸菜 / 酸笋，冷藏未加热）"
    味噌: "10 g"
    发酵饮品: "200 ml（康普茶 / 发酵果蔬汁，未巴氏杀菌）"
  count_rules:
    - "加热过的发酵食品不计份——菌已灭活（如泡菜下锅、纳豆拌热饭）"
    - "馒头 / 面包 / 醋 / 酱油 / 豆瓣酱 不计份——菌已灭活，或用量小到无实际意义"
    - "腐乳计入发酵豆制品但按 10 g 折 1 份，且当日钠预算同步收紧"
    - "巴氏杀菌 / 常温货架的「发酵」产品不计——需冷藏、标「含活性菌」"
  caveats:
    - "泡菜/酸菜类钠高：每日 20–30 g 上限，且当日盐要相应减"
    - "自制发酵注意卫生；腌菜建议腌满 4 周再吃（亚硝酸盐峰值在前 1–2 周）"
    - "本项只做记录与趋势，不做菌群检测、不替代任何医学判断"
  evidence:
    primary: "Wastyk HC, et al. Gut-microbiota-targeted diets modulate human immune status. Cell. 2021;184:4137-4153"
    level: "B+（RCT / n=36 / 10 周 / 替代终点）"

# 运动计划（可选）
# 填了之后，报告会按「星期几」判断该不该练——避免把正常休息日误判成断档。
# 不填也不影响主流程，只是报告不做这项判定。
# workout_plan:
#   primary: ""
#   train_weekdays: [1, 3, 5]     # ISO 星期：周一=1 … 周日=7
#   rest_weekdays: [2, 4, 6, 7]
#   rest_allows_walk: true

# 人群切点（亚洲/中国标准）
thresholds:
  waist_abdominal_obesity_cm: 90   # 男 ≥90 判腹型肥胖；女为 80
  resting_hr_low: 40               # 静息心率低于此值 → 打标
  resting_hr_high: 90              # 静息心率高于此值 → 打标
  spo2_low: 92                     # 血氧低于此值 → 打标 + 建议就医
  sleep_min_minutes: 360           # 睡眠短于此值 → 提示
  trend_days: 30                   # 文字趋势的窗口天数
  trend_chart_days: 14             # 折线图窗口天数（14 天适合看周节奏与噪声）
  report_days: 7                   # 明细展示天数

# 目录（相对项目根，一般不用改）
paths:
  root: .
  db: data/health.db
  raw: data/raw
  meals: data/meals
  metrics: data/metrics
  photos_inbox: photos/inbox
  photos_archive: photos/archive
  reports: reports
  logs: logs

# 数据源（接入后填写）
sources:
  band:
    device: "小米手环"
    route: "mi_fitness"
    enabled: false
    verified_at: ""
    # 数据搬运链路（scripts/sync_band.py）：
    #   小米云端 →(mi-fitness-mcp sync)→ 源库 mi_fitness.db →(sync_band.py)→ 主库 health.db
    # 日报前必须先跑 sync_band.py，否则活动 / 睡眠板块是空的。
    source_db: ""                 # bootstrap 或 install_band_mcp.py 会填好
    mcp_exe: ""
    note: "源库不提供设备标识（MCP 丢弃了 sid）→ 分不出手机/手环，source 统一标 mi_fitness。"
  scale:
    device: "小米体脂秤"
    route: "mi_fitness"
    enabled: false
    verified_at: ""
    # 搬运口径（sync_band.py 的 write_body_metric）：
    #   · 体脂秤会同步**全天每一次**称重 → 只取晨起窗内、当日首条入 body_metric
    #   · **先查后写、绝不覆盖**：该日期主库已有记录（照片 / 口述）一律不动
    window: "05:00-11:00"
    note: "体成分（体脂率/肌肉量/水分率）家用秤本就不准，一律只作参考、只看趋势。"
  photos:
    landing_dir: "photos/inbox"
    enabled: true                 # 仅表示「允许用照片取数」，不代表落盘
    verified_at: ""

# 语言与呈现
display:
  language: zh-CN
  nutrition_range_only: true      # 热量一律以区间呈现，此开关不允许关闭

# 漏记巡检（scripts/audit_entries.py）
audit:
  ignore_name_patterns:
    - "Clipboard_Screenshot*"
    - "Screen*"
    - "screenshot*"
    - "截图*"
